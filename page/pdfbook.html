<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF 小册子 · 完美旋转无拉伸</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
      :root {
        --bg: #f5f5f5;
        --card-bg: #ffffff;
        --primary: #4a6cf7;
        --primary-hover: #3651d5;
        --text: #2d3436;
        --text-secondary: #636e72;
        --border: #e0e0e0;
        --radius: 12px;
        --radius-sm: 8px;
        --success: #27ae60;
        --tag-bg: #eef2ff;
        --tag-text: #4a6cf7;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      .app-container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 20px 60px;
      }
      .app-header {
        text-align: center;
        margin-bottom: 32px;
      }
      .app-header .logo {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      .logo-icon {
        width: 42px;
        height: 42px;
        background: var(--primary);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        color: #fff;
      }
      .app-header h1 {
        font-size: 1.6rem;
        font-weight: 700;
      }
      .subtitle {
        font-size: 0.9rem;
        color: var(--text-secondary);
        margin-top: 2px;
      }
      .card {
        background: var(--card-bg);
        border-radius: var(--radius);
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        padding: 24px;
        margin-bottom: 20px;
        border: 1px solid var(--border);
      }
      .card-title {
        font-size: 1.05rem;
        font-weight: 700;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .icon-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--primary);
      }
      .upload-zone {
        border: 2px dashed #d0d5dd;
        border-radius: var(--radius);
        padding: 40px 24px;
        text-align: center;
        cursor: pointer;
        background: #fafbfc;
        position: relative;
        transition: all 0.25s;
      }
      .upload-zone:hover,
      .upload-zone.drag-over {
        border-color: var(--primary);
        background: #f8f9ff;
      }
      .upload-zone input[type="file"] {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
      }
      .upload-icon {
        font-size: 48px;
        margin-bottom: 12px;
        display: block;
      }
      .upload-text {
        font-weight: 600;
        font-size: 1rem;
      }
      .upload-hint {
        font-size: 0.82rem;
        color: var(--text-secondary);
        margin-top: 4px;
      }
      .file-info-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        background: #f8fafc;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .file-icon {
        font-size: 28px;
      }
      .file-name {
        font-weight: 600;
        flex: 1;
        min-width: 150px;
        word-break: break-all;
      }
      .file-pages {
        font-size: 0.85rem;
        color: var(--text-secondary);
        background: #fff;
        padding: 4px 12px;
        border-radius: 20px;
        border: 1px solid var(--border);
      }
      .btn-remove {
        background: #fff;
        border: 1px solid #e0e0e0;
        color: #999;
        cursor: pointer;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
      }
      .btn-remove:hover {
        background: #fee;
        border-color: #e74c3c;
        color: #e74c3c;
      }
      .btn-group {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 11px 20px;
        border-radius: var(--radius-sm);
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
        border: none;
        transition: all 0.2s;
        white-space: nowrap;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn-primary {
        background: var(--primary);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--primary-hover);
      }
      .btn-accent {
        background: #fff;
        border: 1.5px solid #f39c12;
        color: #e67e22;
      }
      .btn-accent:hover {
        background: #fffdf5;
      }
      .btn-success {
        background: var(--success);
        color: #fff;
      }
      .btn-success:hover {
        background: #219a52;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        pointer-events: none;
      }
      .settings-row {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        margin-top: 12px;
      }
      .settings-row label {
        font-weight: 600;
        font-size: 0.85rem;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .settings-row select,
      .settings-row input {
        padding: 8px 12px;
        border: 1.5px solid var(--border);
        border-radius: 6px;
        font-size: 0.85rem;
        background: #fff;
      }
      .tag {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 600;
        background: var(--tag-bg);
        color: var(--tag-text);
      }
      .toast {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #2d3436;
        color: #fff;
        padding: 12px 24px;
        border-radius: 30px;
        font-weight: 600;
        z-index: 9999;
        animation:
          toastIn 0.35s ease,
          toastOut 0.35s ease 2.2s forwards;
      }
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translate(-50%, -20px);
        }
        to {
          opacity: 1;
          transform: translate(-50%, 0);
        }
      }
      @keyframes toastOut {
        from {
          opacity: 1;
          transform: translate(-50%, 0);
        }
        to {
          opacity: 0;
          transform: translate(-50%, -16px);
        }
      }
      .spinner {
        display: inline-block;
        width: 18px;
        height: 18px;
        border: 2.5px solid #ddd;
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .loading-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(255, 255, 255, 0.75);
        z-index: 9990;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
      }
      .loading-overlay.active {
        display: flex;
      }
      .big-spinner {
        width: 44px;
        height: 44px;
        border-width: 4px;
      }
      .print-only-container {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: -1;
        opacity: 0;
        pointer-events: none;
      }
      @media print {
        body > *:not(.print-only-container) {
          display: none !important;
        }
        .print-only-container {
          display: block !important;
          position: static !important;
          opacity: 1 !important;
          z-index: auto !important;
          pointer-events: auto !important;
          width: 100%;
          background: #fff;
        }
        .print-sheet {
          page-break-after: always;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 100%;
          min-height: 100vh;
          padding: 0;
          margin: 0;
          background: #fff;
        }
        .print-sheet:last-child {
          page-break-after: auto;
        }
        .print-sheet img {
          max-width: 100%;
          max-height: 100vh;
          object-fit: contain;
          display: block;
        }
        @page booklet {
          size: A4 landscape;
          margin: 4mm;
        }
        .print-sheet.booklet-sheet {
          page: booklet;
        }
        @page poster {
          size: A4 portrait;
          margin: 6mm;
        }
        .print-sheet.poster-sheet {
          page: poster;
        }
        @page normal {
          size: A4 portrait;
          margin: 6mm;
        }
        .print-sheet.normal-sheet {
          page: normal;
        }
      }
      @media screen {
        .print-only-container {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <header class="app-header">
        <div class="logo">
          <span class="logo-icon">📄</span>
          <h1>PDF 打印工具箱</h1>
        </div>
        <p class="subtitle">小册子打印 · 海报打印 · 普通打印</p>
      </header>

      <div class="card" id="uploadCard">
        <div class="upload-zone" id="uploadZone">
          <span class="upload-icon">📤</span>
          <p class="upload-text">点击上传或拖拽 PDF 文件到此处</p>
          <p class="upload-hint">自动旋转横版页面，保持原比例，无拉伸</p>
          <input type="file" id="fileInput" accept=".pdf,application/pdf" />
        </div>
        <div class="file-info-bar" id="fileInfoBar" style="display: none">
          <span class="file-icon">📕</span>
          <span class="file-name" id="fileNameDisplay"></span>
          <span class="file-pages" id="filePagesDisplay"></span>
          <button class="btn-remove" id="btnRemoveFile" title="移除">✕</button>
        </div>
      </div>

      <div class="card" id="actionCard" style="display: none">
        <div class="card-title"><span class="icon-dot"></span> 打印操作</div>
        <div class="btn-group" style="margin-bottom: 14px">
          <button class="btn btn-primary" id="btnNormalPrint" disabled>
            🖨️ 普通打印
          </button>
          <button class="btn btn-accent" id="btnBookletPrint" disabled>
            📖 小册子打印
          </button>
          <button class="btn btn-success" id="btnPosterPrint" disabled>
            🖼️ 海报打印
          </button>
          <button class="btn" id="btnDirectPrint" disabled style="background: #f0f0f0; color: #666; border: 1.5px solid #ddd;">
            🔓 直接打印PDF
          </button>
        </div>

        <div id="bookletSettings" style="display: none">
          <span class="tag">📖 小册子模式</span>
          <div class="settings-row">
            <label
              >装订边距
              <input
                type="range"
                id="bookletMarginSlider"
                min="0"
                max="0.15"
                step="0.005"
                value="0.04"
              />
              <span id="bookletMarginValue">4.0%</span>
            </label>
            <span style="font-size: 0.78rem; color: var(--text-secondary)">
              共<strong id="bookletTotalPages">0</strong>页
            </span>
          </div>
          <div
            style="
              font-size: 0.85rem;
              color: #e67e22;
              background: #fff3e0;
              padding: 10px 14px;
              border-radius: 8px;
              border: 1px solid #ffcc80;
              font-weight: 600;
              margin-top: 12px;
              display: flex;
              align-items: center;
              gap: 8px;
            "
          >
            <span style="font-size: 1.2rem">⚠️</span>
            <span>打印设置：横向 + 双面打印（翻转短边）</span>
          </div>
        </div>

        <div id="posterSettings" style="margin-top: 14px">
          <span class="tag">🖼️ 海报模式</span>
          <div class="settings-row">
            <label
              >网格
              <select id="posterGridSelect">
                <option value="2x2">2×2</option>
                <option value="3x3" selected>3×3</option>
                <option value="2x3">2×3</option>
                <option value="4x4">4×4</option>
                <option value="3x4">3×4</option>
              </select></label
            >
            <label
              >目标页
              <input
                type="number"
                id="posterPageInput"
                value="1"
                min="1"
                style="width: 70px"
            /></label>
            <span
              id="posterPageHint"
              style="font-size: 0.78rem; color: var(--text-secondary)"
              >（1-？页）</span
            >
          </div>
        </div>
      </div>
    </div>

<div class="print-only-container" id="printContainer"></div>
<iframe id="pdfFrame" style="display: none"></iframe>
<div class="loading-overlay" id="loadingOverlay">
      <div class="spinner big-spinner"></div>
      <span id="loadingText">正在处理...</span>
    </div>
    <div id="toastContainer"></div>

    <script>
      (function () {
        const uploadZone = document.getElementById("uploadZone");
        const fileInput = document.getElementById("fileInput");
        const fileInfoBar = document.getElementById("fileInfoBar");
        const fileNameDisplay = document.getElementById("fileNameDisplay");
        const filePagesDisplay = document.getElementById("filePagesDisplay");
        const btnRemoveFile = document.getElementById("btnRemoveFile");
        const actionCard = document.getElementById("actionCard");
        const btnNormalPrint = document.getElementById("btnNormalPrint");
        const btnBookletPrint = document.getElementById("btnBookletPrint");
        const btnPosterPrint = document.getElementById("btnPosterPrint");
        const btnDirectPrint = document.getElementById("btnDirectPrint");
        const pdfFrame = document.getElementById("pdfFrame");
        const bookletSettings = document.getElementById("bookletSettings");
        const bookletTotalPages = document.getElementById("bookletTotalPages");
        const bookletMarginSlider = document.getElementById(
          "bookletMarginSlider",
        );
        const bookletMarginValue =
          document.getElementById("bookletMarginValue");
        const posterSettings = document.getElementById("posterSettings");
        const posterGridSelect = document.getElementById("posterGridSelect");
        const posterPageInput = document.getElementById("posterPageInput");
        const posterPageHint = document.getElementById("posterPageHint");
        const printContainer = document.getElementById("printContainer");
        const loadingOverlay = document.getElementById("loadingOverlay");
        const loadingText = document.getElementById("loadingText");
        const toastContainer = document.getElementById("toastContainer");

        let pdfDoc = null,
          totalPages = 0,
          selectedPosterPage = 1;
        let currentPDFFile = null;
        let renderedPagesCache = new Map();
        const PRINT_SCALE = 3.0;
        const BOOKLET_SCALE = 2.5;

        pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        function showToast(msg) {
          const t = document.createElement("div");
          t.className = "toast";
          t.textContent = msg;
          toastContainer.appendChild(t);
          setTimeout(() => t.remove(), 2600);
        }
        function showLoading(msg) {
          loadingText.textContent = msg;
          loadingOverlay.classList.add("active");
        }
        function hideLoading() {
          loadingOverlay.classList.remove("active");
        }

        // 渲染单页，返回 { canvas, width, height }
        async function renderPage(pageNum, scale) {
          const key = `${pageNum}_${scale}`;
          if (renderedPagesCache.has(key)) return renderedPagesCache.get(key);
          if (!pdfDoc) return null;
          const page = await pdfDoc.getPage(pageNum);
          const vp = page.getViewport({ scale });
          const canvas = document.createElement("canvas");
          canvas.width = Math.floor(vp.width);
          canvas.height = Math.floor(vp.height);
          const ctx = canvas.getContext("2d");
          await page.render({ canvasContext: ctx, viewport: vp }).promise;
          const res = { canvas, width: canvas.width, height: canvas.height };
          if (scale <= 1.5) renderedPagesCache.set(key, res);
          return res;
        }

        function clearCache() {
          renderedPagesCache.clear();
        }

        // ---------- 核心：无拉伸自适应绘制（离屏canvas旋转法） ----------
        // rotateDir: 横向页面的旋转方向（1=顺时针90°，-1=逆时针90°，0=自动）
        function drawPageAdaptive(
          ctx,
          sourceCanvas,
          targetX,
          targetY,
          targetW,
          targetH,
          rotateDir = 0,
        ) {
          const sw = sourceCanvas.width,
            sh = sourceCanvas.height;
          if (sw === 0 || sh === 0) return;

          // 1. 创建离屏画布，尺寸与目标区域相同
          const offCanvas = document.createElement("canvas");
          offCanvas.width = targetW;
          offCanvas.height = targetH;
          const offCtx = offCanvas.getContext("2d");
          offCtx.fillStyle = "#ffffff";
          offCtx.fillRect(0, 0, targetW, targetH);

          const srcRatio = sw / sh;
          const dstRatio = targetW / targetH;
          // 判断源图和目标区域的横竖方向
          const isSrcLandscape = srcRatio > 1;
          const isDstLandscape = dstRatio > 1;
          // 是否需要旋转90度（横竖不一致）
          const needsRotate90 = isSrcLandscape !== isDstLandscape;

          if (needsRotate90) {
            // 源图横向，目标纵向：需要旋转90度
            // 根据 rotateDir 决定顺时针还是逆时针
            const dir = rotateDir === 0 ? 1 : rotateDir;
            const baseRotate = dir === 1 ? Math.PI / 2 : -Math.PI / 2;

            const scale = Math.min(targetW / sh, targetH / sw);
            const drawW = sw * scale;
            const drawH = sh * scale;

            offCtx.save();
            offCtx.translate(targetW / 2, targetH / 2);
            offCtx.rotate(baseRotate);
            offCtx.drawImage(
              sourceCanvas,
              -drawW / 2,
              -drawH / 2,
              drawW,
              drawH,
            );
            offCtx.restore();
          } else {
            // 不旋转90度，正常缩放居中
            const scale = Math.min(targetW / sw, targetH / sh);
            const drawW = sw * scale;
            const drawH = sh * scale;

            offCtx.drawImage(
              sourceCanvas,
              (targetW - drawW) / 2,
              (targetH - drawH) / 2,
              drawW,
              drawH,
            );
          }

          // 2. 将离屏画布绘制到目标上下文
          ctx.drawImage(offCanvas, targetX, targetY);
        }

        // 绘制空白区域（纯白）
        function drawBlankArea(ctx, x, y, w, h) {
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(x, y, w, h);
        }

        // ---------- PDF加载 ----------
        async function loadPDF(file) {
          clearCache();
          pdfDoc = null;
          totalPages = 0;
          currentPDFFile = file; // 保存文件用于直接打印
          try {
            const buf = await file.arrayBuffer();
            pdfDoc = await pdfjsLib.getDocument({ data: buf.slice(0) }).promise;
            totalPages = pdfDoc.numPages;
            selectedPosterPage = 1;
            posterPageInput.value = 1;
            posterPageInput.max = totalPages;
            posterPageHint.textContent = `（1-${totalPages}页）`;
            updateUIAfterLoad(file);
            showToast(`✅ 已加载：${file.name}（共 ${totalPages} 页）`);
          } catch (e) {
            showToast("❌ PDF加载失败");
            resetUI();
          }
        }

        function updateUIAfterLoad(file) {
          fileNameDisplay.textContent = file.name;
          filePagesDisplay.textContent = `共 ${totalPages} 页`;
          fileInfoBar.style.display = "flex";
          actionCard.style.display = "block";
          btnNormalPrint.disabled =
            btnBookletPrint.disabled =
            btnPosterPrint.disabled =
            btnDirectPrint.disabled =
              false;
          bookletSettings.style.display = "block";
          posterSettings.style.display = "block";
          updateBookletInfo();
        }

        function resetUI() {
          pdfDoc = null;
          totalPages = 0;
          currentPDFFile = null;
          clearCache();
          fileInfoBar.style.display = "none";
          actionCard.style.display = "none";
          btnNormalPrint.disabled =
            btnBookletPrint.disabled =
            btnPosterPrint.disabled =
            btnDirectPrint.disabled =
              true;
          bookletSettings.style.display = "none";
          posterSettings.style.display = "none";
          printContainer.innerHTML = "";
          fileInput.value = "";
        }

        function updateBookletInfo() {
          if (!totalPages) return;
          bookletTotalPages.textContent = Math.ceil(totalPages / 4) * 4;
        }

        // 小册子页面排序 - 底部朝外版本
        // 纸张横向放置，装订边在中间（gap位置）
        // 打印设置：横向 + 双面打印（翻转短边）
        // 
        // 4页小册子示例（翻转短边后）：
        // 第1张（正面）：左=第4页，右=第1页
        // 第2张（背面）：左=第2页，右=第3页
        // 
        // 竖向页面：正常放置，flip=false
        // 横向页面：需要旋转，rotateDir控制方向（1=顺时针，-1=逆时针）
        // 翻转短边后，横向页面底部自然朝外
        function getBookletOrder(originalCount) {
          const M = Math.ceil(originalCount / 4) * 4;
          const order = [];
          const sheets = M / 2;

          for (let i = 0; i < sheets; i++) {
            const sheetNum = i + 1;
            const isFront = i % 2 === 0;

            let leftPage, rightPage;
            // 横向页面旋转方向：1=顺时针，-1=逆时针，0=不旋转（竖向）
            let leftRotateDir = 0, rightRotateDir = 0;

            const smallPage = sheetNum * 2 - 1;  // 1, 3, 5...
            const largePage = M - (sheetNum - 1) * 2;  // M, M-2...

            if (isFront) {
              // 正面：左=大页码，右=小页码
              leftPage = largePage;
              rightPage = smallPage;
              // 横向页面旋转方向：让底部朝外
              leftRotateDir = 1;   // 大页码顺时针
              rightRotateDir = -1; // 小页码逆时针
            } else {
              // 背面：左=小页码，右=大页码
              leftPage = smallPage;
              rightPage = largePage;
              // 横向页面旋转方向：让底部朝外（与正面相反）
              leftRotateDir = 1;   // 小页码顺时针
              rightRotateDir = -1; // 大页码逆时针
            }

            order.push({
              left: leftPage <= originalCount ? leftPage : 0,
              right: rightPage <= originalCount ? rightPage : 0,
              leftRotateDir,
              rightRotateDir,
            });
          }

          return { order, adjusted: M };
        }

        // ---------- 小册子打印 ----------
        async function prepareBookletPrint() {
          if (!pdfDoc || !totalPages) return showToast("⚠️ 请先上传PDF");
          showLoading("生成小册子…");
          printContainer.innerHTML = "";

          const { order, adjusted } = getBookletOrder(totalPages);
          bookletTotalPages.textContent = adjusted;
          const marginRatio = parseFloat(bookletMarginSlider.value);
          bookletMarginValue.textContent = (marginRatio * 100).toFixed(1) + "%";

          // 确定统一的单页纵向区域：用第一页渲染结果，强制纵向（宽为短边，高为长边）
          const first = await renderPage(1, BOOKLET_SCALE);
          if (!first) {
            hideLoading();
            return;
          }
          const rawW = first.width,
            rawH = first.height;
          const pageW = Math.min(rawW, rawH);
          const pageH = Math.max(rawW, rawH); // pageW ≤ pageH，保证纵向

          const gap = Math.round(pageW * marginRatio);
          const totalW = pageW * 2 + gap;
          const totalH = pageH;

          // 分批处理，每批2张，避免阻塞主线程
          const batchSize = 2;
          for (let batchStart = 0; batchStart < order.length; batchStart += batchSize) {
            const batchEnd = Math.min(batchStart + batchSize, order.length);

            // 并行渲染当前批次的所有页面
            const pagePromises = [];
            for (let i = batchStart; i < batchEnd; i++) {
              const sheet = order[i];
              // 预渲染左页和右页
              const leftPromise = sheet.left
                ? renderPage(sheet.left, BOOKLET_SCALE).catch(() => null)
                : Promise.resolve(null);
              const rightPromise = sheet.right
                ? renderPage(sheet.right, BOOKLET_SCALE).catch(() => null)
                : Promise.resolve(null);
              pagePromises.push(
                Promise.all([leftPromise, rightPromise]).then(([leftRes, rightRes]) => ({
                  i,
                  sheet,
                  leftRes,
                  rightRes,
                }))
              );
            }

            const results = await Promise.all(pagePromises);

            // 绘制批次结果
            for (const { i, sheet, leftRes, rightRes } of results) {
              loadingText.textContent = `小册子 ${i + 1}/${order.length}`;

              const sheetCanvas = document.createElement("canvas");
              sheetCanvas.width = totalW;
              sheetCanvas.height = totalH;
              const ctx = sheetCanvas.getContext("2d");
              ctx.fillStyle = "#fff";
              ctx.fillRect(0, 0, totalW, totalH);

              // 左页
              if (leftRes) {
                drawPageAdaptive(ctx, leftRes.canvas, 0, 0, pageW, pageH, sheet.leftRotateDir);
              } else if (sheet.left) {
                drawBlankArea(ctx, 0, 0, pageW, pageH);
              } else {
                drawBlankArea(ctx, 0, 0, pageW, pageH);
              }

              // 右页
              const rightX = pageW + gap;
              if (rightRes) {
                drawPageAdaptive(ctx, rightRes.canvas, rightX, 0, pageW, pageH, sheet.rightRotateDir);
              } else if (sheet.right) {
                drawBlankArea(ctx, rightX, 0, pageW, pageH);
              } else {
                drawBlankArea(ctx, rightX, 0, pageW, pageH);
              }

              const div = document.createElement("div");
              div.className = "print-sheet booklet-sheet";
              const img = document.createElement("img");
              img.src = sheetCanvas.toDataURL("image/jpeg", 0.95);
              div.appendChild(img);
              printContainer.appendChild(div);
            }

            // 让出时间片，让 UI 更新
            await new Promise((resolve) => setTimeout(resolve, 0));
          }

          hideLoading();
          showToast(`📖 小册子已生成 (${order.length}张)，请打印`);
          setTimeout(() => window.print(), 400);
        }

        // ---------- 海报打印 ----------
        async function preparePosterPrint() {
          if (!pdfDoc) return showToast("⚠️ 请先上传PDF");
          const page = parseInt(posterPageInput.value) || selectedPosterPage;
          if (page < 1 || page > totalPages) return showToast("⚠️ 页码无效");
          selectedPosterPage = page;
          posterPageInput.value = page;

          const [cols, rows] = posterGridSelect.value.split("x").map(Number);
          showLoading(`海报 ${cols}×${rows}…`);
          printContainer.innerHTML = "";

          const posterScale = PRINT_SCALE * Math.max(cols, rows);
          let src;
          try {
            src = await renderPage(page, posterScale);
          } catch {
            hideLoading();
            return;
          }
          if (!src) {
            hideLoading();
            return;
          }

          const sw = src.width,
            sh = src.height;
          const tileW = Math.floor(sw / cols),
            tileH = Math.floor(sh / rows);

          // 分批处理瓦片，每批4个
          const totalTiles = rows * cols;
          const batchSize = 4;
          const tiles = [];

          // 先生成所有瓦片数据
          for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
              const idx = row * cols + col + 1;
              const sx = col * tileW;
              const sy = row * tileH;
              const actW = col === cols - 1 ? sw - sx : tileW;
              const actH = row === rows - 1 ? sh - sy : tileH;
              tiles.push({ idx, sx, sy, actW, actH });
            }
          }

          // 分批处理
          for (let batchStart = 0; batchStart < tiles.length; batchStart += batchSize) {
            const batchEnd = Math.min(batchStart + batchSize, tiles.length);

            for (let i = batchStart; i < batchEnd; i++) {
              const { idx, sx, sy, actW, actH } = tiles[i];
              loadingText.textContent = `瓦片 ${idx}/${totalTiles}`;

              const tileCanvas = document.createElement("canvas");
              tileCanvas.width = Math.round(actW / (posterScale / PRINT_SCALE));
              tileCanvas.height = Math.round(
                actH / (posterScale / PRINT_SCALE),
              );
              const tctx = tileCanvas.getContext("2d");
              tctx.fillStyle = "#fff";
              tctx.fillRect(0, 0, tileCanvas.width, tileCanvas.height);
              tctx.drawImage(
                src.canvas,
                sx,
                sy,
                actW,
                actH,
                0,
                0,
                tileCanvas.width,
                tileCanvas.height,
              );

              const div = document.createElement("div");
              div.className = "print-sheet poster-sheet";
              const img = document.createElement("img");
              img.src = tileCanvas.toDataURL("image/jpeg", 0.95);
              div.appendChild(img);
              printContainer.appendChild(div);
            }

            // 让出时间片，让 UI 更新
            await new Promise((resolve) => setTimeout(resolve, 0));
          }
          hideLoading();
          showToast(`🖼️ 海报已生成，请打印`);
          setTimeout(() => window.print(), 400);
        }

        // ---------- 普通打印 ----------
        async function prepareNormalPrint() {
          if (!pdfDoc) return showToast("⚠️ 请先上传PDF");
          showLoading("普通打印…");
          printContainer.innerHTML = "";

          // 分批处理，每批2页，避免阻塞主线程
          const batchSize = 2;
          for (let batchStart = 1; batchStart <= totalPages; batchStart += batchSize) {
            const batchEnd = Math.min(batchStart + batchSize - 1, totalPages);

            // 并行渲染当前批次
            const batchPromises = [];
            for (let i = batchStart; i <= batchEnd; i++) {
              batchPromises.push(
                renderPage(i, PRINT_SCALE).then((res) => ({ i, res }))
              );
            }

            const results = await Promise.all(batchPromises);

            // 添加渲染好的页面到 DOM
            for (const { i, res } of results) {
              if (!res) continue;
              loadingText.textContent = `第 ${i}/${totalPages} 页`;
              const div = document.createElement("div");
              div.className = "print-sheet normal-sheet";
              const img = document.createElement("img");
              img.src = res.canvas.toDataURL("image/jpeg", 0.95);
              div.appendChild(img);
              printContainer.appendChild(div);
            }

            // 让出时间片，让 UI 更新
            await new Promise((resolve) => setTimeout(resolve, 0));
          }

          hideLoading();
          showToast(`🖨️ 普通打印已生成`);
          setTimeout(() => window.print(), 400);
        }

        // ---------- 事件绑定 ----------
        fileInput.addEventListener("change", (e) => {
          const f = e.target.files[0];
          if (f?.type === "application/pdf" || f?.name.endsWith(".pdf"))
            loadPDF(f);
          else if (f) showToast("⚠️ 仅支持PDF");
        });
        uploadZone.addEventListener("dragover", (e) => {
          e.preventDefault();
          uploadZone.classList.add("drag-over");
        });
        uploadZone.addEventListener("dragleave", () =>
          uploadZone.classList.remove("drag-over"),
        );
        uploadZone.addEventListener("drop", (e) => {
          e.preventDefault();
          uploadZone.classList.remove("drag-over");
          const f = e.dataTransfer.files[0];
          if (f?.type === "application/pdf" || f?.name.endsWith(".pdf"))
            loadPDF(f);
          else if (f) showToast("⚠️ 仅支持PDF");
        });
        btnRemoveFile.addEventListener("click", () => {
          resetUI();
          showToast("文件已移除");
        });
        btnNormalPrint.addEventListener("click", prepareNormalPrint);
        btnBookletPrint.addEventListener("click", () => {
          bookletSettings.style.display = "block";
          updateBookletInfo();
          prepareBookletPrint();
        });
        btnPosterPrint.addEventListener("click", () => {
          posterSettings.style.display = "block";
          preparePosterPrint();
        });
        btnDirectPrint.addEventListener("click", () => {
          if (!currentPDFFile) return showToast("⚠️ 请先上传PDF");
          showLoading("正在加载 PDF 预览...");
          // 使用 iframe 直接打印 PDF
          const fileURL = URL.createObjectURL(currentPDFFile);
          pdfFrame.src = fileURL;
          pdfFrame.onload = () => {
            // 延迟一点再打印，让加载提示先渲染
            setTimeout(() => {
              hideLoading();
              pdfFrame.contentWindow.print();
              URL.revokeObjectURL(fileURL);
            }, 300);
          };
          // 超时处理（10秒后自动隐藏加载）
          setTimeout(() => {
            if (loadingOverlay.classList.contains("active")) {
              hideLoading();
            }
          }, 10000);
        });
        posterPageInput.addEventListener("change", () => {
          let v = parseInt(posterPageInput.value);
          if (isNaN(v) || v < 1) v = 1;
          if (v > totalPages) v = totalPages;
          selectedPosterPage = v;
          posterPageInput.value = v;
        });
        bookletMarginSlider.addEventListener("input", () => {
          bookletMarginValue.textContent =
            (parseFloat(bookletMarginSlider.value) * 100).toFixed(1) + "%";
        });
      })();
    </script>
  </body>
</html>
