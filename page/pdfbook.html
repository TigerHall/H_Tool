<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF 小册子 · 完美旋转无拉伸</title>
    <style>
      :root {
        --bg: #f5f5f5;
        --card-bg: #ffffff;
        --primary: #4a6cf7;
        --primary-hover: #3651d5;
        --text: #2d3436;
        --text-secondary: #636e72;
        --border: #e0e0e0;
        --radius: 12px;
        --radius-sm: 8px;
        --success: #27ae60;
        --tag-bg: #eef2ff;
        --tag-text: #4a6cf7;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }
      .app-container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 20px 60px;
      }
      .app-header {
        text-align: center;
        margin-bottom: 32px;
      }
      .app-header .logo {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }
      .logo-icon {
        width: 42px;
        height: 42px;
        background: var(--primary);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        color: #fff;
      }
      .app-header h1 {
        font-size: 1.6rem;
        font-weight: 700;
      }
      .subtitle {
        font-size: 0.9rem;
        color: var(--text-secondary);
        margin-top: 2px;
      }
      .card {
        background: var(--card-bg);
        border-radius: var(--radius);
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        padding: 24px;
        margin-bottom: 20px;
        border: 1px solid var(--border);
      }
      .card-title {
        font-size: 1.05rem;
        font-weight: 700;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .icon-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--primary);
      }
      .upload-zone {
        border: 2px dashed #d0d5dd;
        border-radius: var(--radius);
        padding: 40px 24px;
        text-align: center;
        cursor: pointer;
        background: #fafbfc;
        position: relative;
        transition: all 0.25s;
      }
      .upload-zone:hover,
      .upload-zone.drag-over {
        border-color: var(--primary);
        background: #f8f9ff;
      }
      .upload-zone input[type="file"] {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
      }
      .upload-icon {
        font-size: 48px;
        margin-bottom: 12px;
        display: block;
      }
      .upload-text {
        font-weight: 600;
        font-size: 1rem;
      }
      .upload-hint {
        font-size: 0.82rem;
        color: var(--text-secondary);
        margin-top: 4px;
      }
      .file-info-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        background: #f8fafc;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border);
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .file-icon {
        font-size: 28px;
      }
      .file-name {
        font-weight: 600;
        flex: 1;
        min-width: 150px;
        word-break: break-all;
      }
      .file-pages {
        font-size: 0.85rem;
        color: var(--text-secondary);
        background: #fff;
        padding: 4px 12px;
        border-radius: 20px;
        border: 1px solid var(--border);
      }
      .btn-remove {
        background: #fff;
        border: 1px solid #e0e0e0;
        color: #999;
        cursor: pointer;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
      }
      .btn-remove:hover {
        background: #fee;
        border-color: #e74c3c;
        color: #e74c3c;
      }
      .btn-group {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 11px 20px;
        border-radius: var(--radius-sm);
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
        border: none;
        transition: all 0.2s;
        white-space: nowrap;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn-primary {
        background: var(--primary);
        color: #fff;
      }
      .btn-primary:hover {
        background: var(--primary-hover);
      }
      .btn-accent {
        background: #fff;
        border: 1.5px solid #f39c12;
        color: #e67e22;
      }
      .btn-accent:hover {
        background: #fffdf5;
      }
      .btn-success {
        background: var(--success);
        color: #fff;
      }
      .btn-success:hover {
        background: #219a52;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        pointer-events: none;
      }
      .settings-row {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        margin-top: 12px;
      }
      .settings-row label {
        font-weight: 600;
        font-size: 0.85rem;
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .settings-row select,
      .settings-row input {
        padding: 8px 12px;
        border: 1.5px solid var(--border);
        border-radius: 6px;
        font-size: 0.85rem;
        background: #fff;
      }
      .tag {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 0.75rem;
        font-weight: 600;
        background: var(--tag-bg);
        color: var(--tag-text);
      }
      .toast {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #2d3436;
        color: #fff;
        padding: 12px 24px;
        border-radius: 30px;
        font-weight: 600;
        z-index: 9999;
        animation:
          toastIn 0.35s ease,
          toastOut 0.35s ease 2.2s forwards;
      }
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translate(-50%, -20px);
        }
        to {
          opacity: 1;
          transform: translate(-50%, 0);
        }
      }
      @keyframes toastOut {
        from {
          opacity: 1;
          transform: translate(-50%, 0);
        }
        to {
          opacity: 0;
          transform: translate(-50%, -16px);
        }
      }
      .spinner {
        display: inline-block;
        width: 18px;
        height: 18px;
        border: 2.5px solid #ddd;
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .loading-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(255, 255, 255, 0.75);
        z-index: 9990;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
      }
      .loading-overlay.active {
        display: flex;
      }
      /* 初始加载（pdf.js 未就绪前） */
      .init-loading {
        position: fixed;
        inset: 0;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        gap: 14px;
      }
      .init-loading.hidden {
        display: none;
      }
      .init-loading p {
        font-size: 0.95rem;
        color: var(--text-secondary);
        font-weight: 500;
      }
      .big-spinner {
        width: 44px;
        height: 44px;
        border-width: 4px;
      }
      .print-only-container {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: -1;
        opacity: 0;
        pointer-events: none;
      }
      @media print {
        body > *:not(.print-only-container) {
          display: none !important;
        }
        .print-only-container {
          display: block !important;
          position: static !important;
          opacity: 1 !important;
          z-index: auto !important;
          pointer-events: auto !important;
          width: 100%;
          background: #fff;
        }
        .print-sheet {
          page-break-after: always;
          display: flex;
          align-items: center;
          justify-content: center;
          width: 100%;
          min-height: 100vh;
          padding: 0;
          margin: 0;
          background: #fff;
        }
        .print-sheet:last-child {
          page-break-after: auto;
        }
        .print-sheet img {
          max-width: 100%;
          max-height: 100vh;
          object-fit: contain;
          display: block;
        }
        @page booklet {
          size: A4 landscape;
          margin: 0;
        }
        .print-sheet.booklet-sheet {
          page: booklet;
        }
        @page poster {
          size: A4 portrait;
          margin: 0;
        }
        .print-sheet.poster-sheet {
          page: poster;
        }
        @page normal {
          size: A4 portrait;
          margin: 0;
        }
        .print-sheet.normal-sheet {
          page: normal;
        }
      }
      @media screen {
        .print-only-container {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- 初始加载：pdf.js 未就绪时显示 -->
    <div class="init-loading" id="initLoading">
      <div class="spinner big-spinner"></div>
      <p>正在加载 PDF 引擎...</p>
    </div>
    <div class="app-container">
      <header class="app-header">
        <div class="logo">
          <span class="logo-icon">📄</span>
          <h1>PDF 打印工具箱</h1>
        </div>
        <p class="subtitle">小册子打印 · 海报打印 · 普通打印</p>
      </header>

      <div class="card" id="uploadCard">
        <div class="upload-zone" id="uploadZone">
          <span class="upload-icon">📤</span>
          <p class="upload-text">点击上传或拖拽 PDF 文件到此处</p>
          <p class="upload-hint">自动旋转横版页面，保持原比例，无拉伸</p>
          <input type="file" id="fileInput" accept=".pdf,application/pdf" />
        </div>
        <div class="file-info-bar" id="fileInfoBar" style="display: none">
          <span class="file-icon">📕</span>
          <span class="file-name" id="fileNameDisplay"></span>
          <span class="file-pages" id="filePagesDisplay"></span>
          <button class="btn-remove" id="btnRemoveFile" title="移除">✕</button>
        </div>
      </div>

      <div class="card" id="actionCard" style="display: none">
        <div class="card-title"><span class="icon-dot"></span> 打印操作</div>
        <div class="btn-group" style="margin-bottom: 14px">
          <button class="btn btn-primary" id="btnNormalPrint" disabled>
            🖨️ 普通打印
          </button>
          <button class="btn btn-accent" id="btnBookletPrint" disabled>
            📖 小册子打印
          </button>
          <button class="btn btn-success" id="btnPosterPrint" disabled>
            🖼️ 海报打印
          </button>
          <button class="btn" id="btnDirectPrint" disabled style="background: #f0f0f0; color: #666; border: 1.5px solid #ddd;">
            🔓 直接打印PDF
          </button>
        </div>

        <div id="bookletSettings" style="display: none">
          <span class="tag">📖 小册子模式</span>
          <div class="settings-row">
            <label
              >装订边距
              <input
                type="range"
                id="bookletMarginSlider"
                min="0"
                max="4"
                step="0.1"
                value="0.5"
              />
              <span id="bookletMarginValue">0.5 cm</span>
            </label>
            <span style="font-size: 0.78rem; color: var(--text-secondary)">
              共<strong id="bookletTotalPages">0</strong>页
            </span>
          </div>
          <div class="settings-row" style="margin-top:4px">
            <label
              >排版模式
              <select id="bookletModeSelect">
                <option value="offset" selected>偏移（原大小，向两侧移动）</option>
                <option value="scale">等比缩小（整体缩至A4内）</option>
              </select>
            </label>
          </div>
          <div
            style="
              font-size: 0.85rem;
              color: #e67e22;
              background: #fff3e0;
              padding: 10px 14px;
              border-radius: 8px;
              border: 1px solid #ffcc80;
              font-weight: 600;
              margin-top: 12px;
              display: flex;
              align-items: center;
              gap: 8px;
            "
          >
            <span style="font-size: 1.2rem">⚠️</span>
            <span>打印设置：横向 + 双面打印（翻转短边）</span>
          </div>
        </div>

        <div id="posterSettings" style="margin-top: 14px">
          <span class="tag">🖼️ 海报模式</span>
          <div class="settings-row">
            <label
              >网格
              <select id="posterGridSelect">
                <option value="2x2">2×2</option>
                <option value="3x3" selected>3×3</option>
                <option value="2x3">2×3</option>
                <option value="4x4">4×4</option>
                <option value="3x4">3×4</option>
              </select></label
            >
            <label
              >目标页
              <input
                type="number"
                id="posterPageInput"
                value="1"
                min="1"
                style="width: 70px"
            /></label>
            <span
              id="posterPageHint"
              style="font-size: 0.78rem; color: var(--text-secondary)"
              >（1-？页）</span
            >
          </div>
        </div>
      </div>
    </div>

<div class="print-only-container" id="printContainer"></div>
<iframe id="pdfFrame" style="display: none"></iframe>
<div class="loading-overlay" id="loadingOverlay">
      <div class="spinner big-spinner"></div>
      <span id="loadingText">正在处理...</span>
    </div>
    <div id="toastContainer"></div>

    <script>
      (function () {
        const initLoading = document.getElementById("initLoading");
        const uploadZone = document.getElementById("uploadZone");
        const fileInput = document.getElementById("fileInput");
        const fileInfoBar = document.getElementById("fileInfoBar");
        const fileNameDisplay = document.getElementById("fileNameDisplay");
        const filePagesDisplay = document.getElementById("filePagesDisplay");
        const btnRemoveFile = document.getElementById("btnRemoveFile");
        const actionCard = document.getElementById("actionCard");
        const btnNormalPrint = document.getElementById("btnNormalPrint");
        const btnBookletPrint = document.getElementById("btnBookletPrint");
        const btnPosterPrint = document.getElementById("btnPosterPrint");
        const btnDirectPrint = document.getElementById("btnDirectPrint");
        const pdfFrame = document.getElementById("pdfFrame");
        const bookletSettings = document.getElementById("bookletSettings");
        const bookletTotalPages = document.getElementById("bookletTotalPages");
        const bookletMarginSlider = document.getElementById(
          "bookletMarginSlider",
        );
        const bookletMarginValue =
          document.getElementById("bookletMarginValue");
        const bookletModeSelect = document.getElementById("bookletModeSelect");
        const posterSettings = document.getElementById("posterSettings");
        const posterGridSelect = document.getElementById("posterGridSelect");
        const posterPageInput = document.getElementById("posterPageInput");
        const posterPageHint = document.getElementById("posterPageHint");
        const printContainer = document.getElementById("printContainer");
        const loadingOverlay = document.getElementById("loadingOverlay");
        const loadingText = document.getElementById("loadingText");
        const toastContainer = document.getElementById("toastContainer");

        let pdfDoc = null,
          totalPages = 0,
          selectedPosterPage = 1;
        let currentPDFFile = null;
        let renderedPagesCache = new Map();
        const PRINT_SCALE = 4.0;
        const BOOKLET_SCALE = 3.5;
        const JPEG_QUALITY = 0.98;

        // 动态加载 pdf.js（加载期间 initLoading 全屏提示可见）
        function loadPdfJS() {
          return new Promise((resolve, reject) => {
            if (typeof pdfjsLib !== "undefined") {
              resolve();
              return;
            }
            const script = document.createElement("script");
            script.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
            script.onload = () => resolve();
            script.onerror = () => reject(new Error("PDF.js 加载失败"));
            document.head.appendChild(script);
          });
        }

        // 入口：等待 pdf.js 就绪后隐藏初始 loading，再初始化
        async function initApp() {
          try {
            await loadPdfJS();
          } catch (e) {
            initLoading.querySelector("p").textContent = "PDF 引擎加载失败，请检查网络后刷新页面";
            initLoading.querySelector(".spinner").style.display = "none";
            return;
          }
          pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
          initLoading.classList.add("hidden");
        }

        initApp();

        function showToast(msg) {
          const t = document.createElement("div");
          t.className = "toast";
          t.textContent = msg;
          toastContainer.appendChild(t);
          setTimeout(() => t.remove(), 2600);
        }
        function showLoading(msg) {
          loadingText.textContent = msg;
          loadingOverlay.classList.add("active");
        }
        function hideLoading() {
          loadingOverlay.classList.remove("active");
        }

        // 渲染单页，返回 { canvas, width, height }
        async function renderPage(pageNum, scale) {
          const key = `${pageNum}_${scale}`;
          if (renderedPagesCache.has(key)) return renderedPagesCache.get(key);
          if (!pdfDoc) return null;
          const page = await pdfDoc.getPage(pageNum);
          const vp = page.getViewport({ scale });
          const canvas = document.createElement("canvas");
          canvas.width = Math.floor(vp.width);
          canvas.height = Math.floor(vp.height);
          const ctx = canvas.getContext("2d");
          await page.render({ canvasContext: ctx, viewport: vp }).promise;
          const res = { canvas, width: canvas.width, height: canvas.height };
          if (scale <= 1.5) renderedPagesCache.set(key, res);
          return res;
        }

        function clearCache() {
          renderedPagesCache.clear();
        }

        // ---------- 核心：无拉伸自适应绘制（离屏canvas旋转法） ----------
        // rotateDir: 横向页面的旋转方向（1=顺时针90°，-1=逆时针90°，0=自动）
        function drawPageAdaptive(
          ctx,
          sourceCanvas,
          targetX,
          targetY,
          targetW,
          targetH,
          rotateDir = 0,
        ) {
          const sw = sourceCanvas.width,
            sh = sourceCanvas.height;
          if (sw === 0 || sh === 0) return;

          // 1. 创建离屏画布，尺寸与目标区域相同
          const offCanvas = document.createElement("canvas");
          offCanvas.width = targetW;
          offCanvas.height = targetH;
          const offCtx = offCanvas.getContext("2d");
          offCtx.fillStyle = "#ffffff";
          offCtx.fillRect(0, 0, targetW, targetH);

          const srcRatio = sw / sh;
          const dstRatio = targetW / targetH;
          // 判断源图和目标区域的横竖方向
          const isSrcLandscape = srcRatio > 1;
          const isDstLandscape = dstRatio > 1;
          // 是否需要旋转90度（横竖不一致）
          const needsRotate90 = isSrcLandscape !== isDstLandscape;

          if (needsRotate90) {
            // 源图横向，目标纵向：需要旋转90度
            // 根据 rotateDir 决定顺时针还是逆时针
            const dir = rotateDir === 0 ? 1 : rotateDir;
            const baseRotate = dir === 1 ? Math.PI / 2 : -Math.PI / 2;

            const scale = Math.min(targetW / sh, targetH / sw);
            const drawW = sw * scale;
            const drawH = sh * scale;

            offCtx.save();
            offCtx.translate(targetW / 2, targetH / 2);
            offCtx.rotate(baseRotate);
            offCtx.drawImage(
              sourceCanvas,
              -drawW / 2,
              -drawH / 2,
              drawW,
              drawH,
            );
            offCtx.restore();
          } else {
            // 不旋转90度，正常缩放居中
            const scale = Math.min(targetW / sw, targetH / sh);
            const drawW = sw * scale;
            const drawH = sh * scale;

            offCtx.drawImage(
              sourceCanvas,
              (targetW - drawW) / 2,
              (targetH - drawH) / 2,
              drawW,
              drawH,
            );
          }

          // 2. 将离屏画布绘制到目标上下文
          ctx.drawImage(offCanvas, targetX, targetY);
        }

        // 绘制空白区域（纯白）
        function drawBlankArea(ctx, x, y, w, h) {
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(x, y, w, h);
        }

        // ---------- PDF加载 ----------
        async function loadPDF(file) {
          clearCache();
          pdfDoc = null;
          totalPages = 0;
          currentPDFFile = file; // 保存文件用于直接打印
          try {
            const buf = await file.arrayBuffer();
            pdfDoc = await pdfjsLib.getDocument({ data: buf.slice(0) }).promise;
            totalPages = pdfDoc.numPages;
            selectedPosterPage = 1;
            posterPageInput.value = 1;
            posterPageInput.max = totalPages;
            posterPageHint.textContent = `（1-${totalPages}页）`;
            updateUIAfterLoad(file);
            showToast(`✅ 已加载：${file.name}（共 ${totalPages} 页）`);
          } catch (e) {
            showToast("❌ PDF加载失败");
            resetUI();
          }
        }

        function updateUIAfterLoad(file) {
          fileNameDisplay.textContent = file.name;
          filePagesDisplay.textContent = `共 ${totalPages} 页`;
          fileInfoBar.style.display = "flex";
          actionCard.style.display = "block";
          btnNormalPrint.disabled =
            btnBookletPrint.disabled =
            btnPosterPrint.disabled =
            btnDirectPrint.disabled =
              false;
          bookletSettings.style.display = "block";
          posterSettings.style.display = "block";
          updateBookletInfo();
        }

        function resetUI() {
          pdfDoc = null;
          totalPages = 0;
          currentPDFFile = null;
          clearCache();
          fileInfoBar.style.display = "none";
          actionCard.style.display = "none";
          btnNormalPrint.disabled =
            btnBookletPrint.disabled =
            btnPosterPrint.disabled =
            btnDirectPrint.disabled =
              true;
          bookletSettings.style.display = "none";
          posterSettings.style.display = "none";
          printContainer.innerHTML = "";
          fileInput.value = "";
        }

        function updateBookletInfo() {
          if (!totalPages) return;
          bookletTotalPages.textContent = Math.ceil(totalPages / 4) * 4;
        }

        // 小册子页面排序 - 骑马钉拼版
        // 纸张横向放置，装订边在中间（gap位置），双面打印（翻转短边）
        //
        // 拼版规则（每张物理纸的正反两面）：
        //   M=总页数(已补至4的倍数), 物理纸数=M/4, 输出页数=M/2
        //   第p张物理纸(p从0开始)：
        //     正面(输出页2p):   左=M-2p,   右=2p+1
        //     背面(输出页2p+1): 左=2p+2,   右=M-2p-1
        //
        // 8页示例：
        //   纸1正面(k=0): [8,1]  纸1背面(k=1): [2,7]
        //   纸2正面(k=2): [6,3]  纸2背面(k=3): [4,5]
        //   双面打印+折叠后阅读顺序: 1→2→3→4→5→6→7→8
        //
        // rotateDir: 横向页面旋转方向（1=顺时针90°,-1=逆时针90°,0=不旋转）
        //   翻转短边后，左右页都需要底部朝外
        function getBookletOrder(originalCount) {
          const M = Math.ceil(originalCount / 4) * 4;
          const order = [];
          const totalOutputs = M / 2;  // 正反面总输出页数

          for (let k = 0; k < totalOutputs; k++) {
            const physicalSheet = Math.floor(k / 2);  // 第几张物理纸(0-indexed)
            const isFront = k % 2 === 0;

            let leftPage, rightPage;
            let leftRotateDir = 0, rightRotateDir = 0;

            if (isFront) {
              // 正面：左=大页码(从M递减), 右=小页码(从1递增)
              leftPage = M - 2 * physicalSheet;
              rightPage = 2 * physicalSheet + 1;
              leftRotateDir = 1;
              rightRotateDir = -1;
            } else {
              // 背面：左=小页码(从2递增), 右=大页码(从M-1递减)
              leftPage = 2 * physicalSheet + 2;
              rightPage = M - 2 * physicalSheet - 1;
              leftRotateDir = 1;
              rightRotateDir = -1;
            }

            order.push({
              left: leftPage <= originalCount ? leftPage : 0,
              right: rightPage <= originalCount ? rightPage : 0,
              leftRotateDir,
              rightRotateDir,
            });
          }

          return { order, adjusted: M };
        }

        // ================================================================
        //  小册子打印——完整流程说明
        // ================================================================
        //  第1步：确定页码排序（骑马钉拼版）
        //    getBookletOrder() 算出每张纸正反面各放哪两页，补齐到4的倍数
        //
        //  第2步：确定纸张尺寸
        //    目标纸 = A4 横向 (297×210mm)，每个页面放在 A5 竖版槽位 (148.5×210mm)
        //    用 pdf.js 以 BOOKLET_SCALE 倍率渲染原始 PDF 页面
        //
        //  第3步：收集唯一页码 → 一次性并行渲染（全速）
        //
        //  第4步：将所有页面放入 A5 槽位
        //    drawPageAdaptive 自动处理：
        //      - 竖版页面：等比缩放到 A5 槽内居中
        //      - 横版页面：旋转90°后等比缩放到 A5 槽内居中
        //      - 旋转方向由 getBookletOrder 预设 (leftRotateDir/rightRotateDir)
        //
        //  第5步：根据排版模式放置 A5 槽位
        //    偏移模式：画布 = A4横向，两个A5槽从中线向两侧各移 gap/2
        //    等比模式：画布 = 2*A5宽 + gap，整体通过CSS缩到A4横向
        // ================================================================
        async function prepareBookletPrint() {
          if (!pdfDoc || !totalPages) return showToast("⚠️ 请先上传PDF");
          showLoading("生成小册子… 请勿离开页面");
          printContainer.innerHTML = "";

          const { order, adjusted } = getBookletOrder(totalPages);
          bookletTotalPages.textContent = adjusted;
          const gapCm = parseFloat(bookletMarginSlider.value);
          const mode = bookletModeSelect.value;
          bookletMarginValue.textContent = gapCm.toFixed(1) + " cm";

          // ---- 标准 A4/A5 尺寸（基于渲染 DPI） ----
          const effectiveDPI = 72 * BOOKLET_SCALE;
          const cmToPx = (cm) => Math.round(cm / 2.54 * effectiveDPI);
          const a4LandscapeW = cmToPx(29.7);
          const a4LandscapeH = cmToPx(21.0);
          const a5SlotW = cmToPx(14.85);  // A5 竖版宽 = A4横向宽的一半
          const a5SlotH = cmToPx(21.0);   // A5 竖版高 = A4横向高

          const gapPx = cmToPx(gapCm);

          // ---- 根据排版模式计算画布尺寸和槽位坐标 ----
          let totalW, totalH, leftX, rightX;
          if (mode === "offset") {
            // 偏移模式：画布 = A4横向（固定），槽位从中间向两侧移动
            totalW = a4LandscapeW;
            totalH = a4LandscapeH;
            const center = a4LandscapeW / 2;
            const halfGap = gapPx / 2;
            leftX  = Math.round(center - halfGap - a5SlotW);
            rightX = Math.round(center + halfGap);
            // 例 gap=0: leftX=0, rightX=a5SlotW (两页紧贴中线)
            // 例 gap=1cm: leftX≈-50, rightX≈1523 (各外移0.5cm，左侧超出部分被画布裁剪)
          } else {
            // 等比缩小模式：gap分布在中间(装订)和两侧(外边距)，整体等比缩至A4
            // 画布布局: [gap/2] [A5左页] [gap] [A5右页] [gap/2]
            const sidePad = Math.round(gapPx / 2);
            totalW = a5SlotW * 2 + gapPx + sidePad * 2;
            totalH = a5SlotH;
            leftX  = sidePad;
            rightX = sidePad + a5SlotW + gapPx;
          }

          // ---- 第3+4+5步：分批渲染+排版（控制内存，大PDF不爆） ----
          // 每批处理 SHEET_BATCH 张输出页，只渲染当前批次需要的PDF页面
          const SHEET_BATCH = 8; // 每批8张输出页 = 4张物理纸 = 16页PDF ≈ 380MB
          for (let batchStart = 0; batchStart < order.length; batchStart += SHEET_BATCH) {
            const batchEnd = Math.min(batchStart + SHEET_BATCH, order.length);

            // 收集本批次唯一页码
            const batchPages = new Set();
            for (let i = batchStart; i < batchEnd; i++) {
              if (order[i].left) batchPages.add(order[i].left);
              if (order[i].right) batchPages.add(order[i].right);
            }

            // 并行渲染本批次页面
            const pageMap = new Map();
            const promises = [];
            for (const p of batchPages) {
              promises.push(
                renderPage(p, BOOKLET_SCALE).catch(() => null).then(res => {
                  if (res) pageMap.set(p, res);
                })
              );
            }
            await Promise.all(promises);

            // 合成本批次输出页，完成后释放页面内存
            for (let i = batchStart; i < batchEnd; i++) {
              const sheet = order[i];
              loadingText.textContent = `排版中 ${i + 1}/${order.length}，请勿离开页面`;

              const sheetCanvas = document.createElement("canvas");
              sheetCanvas.width = totalW;
              sheetCanvas.height = totalH;
              const ctx = sheetCanvas.getContext("2d");
              ctx.fillStyle = "#fff";
              ctx.fillRect(0, 0, totalW, totalH);

              const leftRes = sheet.left ? pageMap.get(sheet.left) || null : null;
              const rightRes = sheet.right ? pageMap.get(sheet.right) || null : null;

              if (leftRes) {
                drawPageAdaptive(ctx, leftRes.canvas, leftX, 0, a5SlotW, a5SlotH, sheet.leftRotateDir);
              } else {
                drawBlankArea(ctx, leftX, 0, a5SlotW, a5SlotH);
              }

              if (rightRes) {
                drawPageAdaptive(ctx, rightRes.canvas, rightX, 0, a5SlotW, a5SlotH, sheet.rightRotateDir);
              } else {
                drawBlankArea(ctx, rightX, 0, a5SlotW, a5SlotH);
              }

              const div = document.createElement("div");
              div.className = "print-sheet booklet-sheet";
              const img = document.createElement("img");
              img.src = sheetCanvas.toDataURL("image/jpeg", JPEG_QUALITY);
              div.appendChild(img);
              printContainer.appendChild(div);

              await new Promise((r) => setTimeout(r, 0));
            }
            // batch 结束，pageMap 出作用域 → 本批次页面 canvas 被 GC 回收
          }

          hideLoading();
          showToast(`📖 小册子已生成 (${order.length}张)，请打印`);
          setTimeout(() => window.print(), 400);
        }

        // ---------- 海报打印 ----------
        async function preparePosterPrint() {
          if (!pdfDoc) return showToast("⚠️ 请先上传PDF");
          const page = parseInt(posterPageInput.value) || selectedPosterPage;
          if (page < 1 || page > totalPages) return showToast("⚠️ 页码无效");
          selectedPosterPage = page;
          posterPageInput.value = page;

          const [cols, rows] = posterGridSelect.value.split("x").map(Number);
          showLoading(`海报 ${cols}×${rows}… 请勿离开页面`);
          printContainer.innerHTML = "";

          const posterScale = PRINT_SCALE * Math.max(cols, rows);
          let src;
          try {
            src = await renderPage(page, posterScale);
          } catch {
            hideLoading();
            return;
          }
          if (!src) { hideLoading(); return; }

          const sw = src.width, sh = src.height;
          const tileW = Math.floor(sw / cols), tileH = Math.floor(sh / rows);
          const totalTiles = rows * cols;

          for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
              const idx = row * cols + col + 1;
              loadingText.textContent = `切片 ${idx}/${totalTiles}，请勿离开页面`;

              const sx = col * tileW;
              const sy = row * tileH;
              const actW = col === cols - 1 ? sw - sx : tileW;
              const actH = row === rows - 1 ? sh - sy : tileH;

              const scaleDown = PRINT_SCALE / posterScale;
              const tileCanvas = document.createElement("canvas");
              tileCanvas.width = Math.round(actW * scaleDown);
              tileCanvas.height = Math.round(actH * scaleDown);
              const tctx = tileCanvas.getContext("2d");
              tctx.fillStyle = "#fff";
              tctx.fillRect(0, 0, tileCanvas.width, tileCanvas.height);
              tctx.drawImage(src.canvas, sx, sy, actW, actH, 0, 0, tileCanvas.width, tileCanvas.height);

              const div = document.createElement("div");
              div.className = "print-sheet poster-sheet";
              const img = document.createElement("img");
              img.src = tileCanvas.toDataURL("image/jpeg", JPEG_QUALITY);
              div.appendChild(img);
              printContainer.appendChild(div);

              await new Promise((r) => setTimeout(r, 0));
            }
          }

          hideLoading();
          showToast(`🖼️ 海报已生成，请打印`);
          setTimeout(() => window.print(), 400);
        }

        // ---------- 普通打印 ----------
        async function prepareNormalPrint() {
          if (!pdfDoc) return showToast("⚠️ 请先上传PDF");
          showLoading("普通打印… 请勿离开页面");
          printContainer.innerHTML = "";

          // 分批渲染，每批 PAGE_BATCH 页，控制内存
          const PAGE_BATCH = 8;
          for (let batchStart = 1; batchStart <= totalPages; batchStart += PAGE_BATCH) {
            const batchEnd = Math.min(batchStart + PAGE_BATCH - 1, totalPages);

            const renderPromises = [];
            for (let i = batchStart; i <= batchEnd; i++) {
              renderPromises.push(
                renderPage(i, PRINT_SCALE).then(res => ({ i, res }))
              );
            }
            const results = await Promise.all(renderPromises);

            for (const { i, res } of results) {
              if (!res) continue;
              loadingText.textContent = `排版中 ${i}/${totalPages}，请勿离开页面`;

              const div = document.createElement("div");
              div.className = "print-sheet normal-sheet";
              const img = document.createElement("img");
              img.src = res.canvas.toDataURL("image/jpeg", JPEG_QUALITY);
              div.appendChild(img);
              printContainer.appendChild(div);

              await new Promise((r) => setTimeout(r, 0));
            }
          }

          hideLoading();
          showToast(`🖨️ 普通打印已生成`);
          setTimeout(() => window.print(), 400);
        }

        // ---------- 事件绑定 ----------
        fileInput.addEventListener("change", (e) => {
          const f = e.target.files[0];
          if (f?.type === "application/pdf" || f?.name.endsWith(".pdf"))
            loadPDF(f);
          else if (f) showToast("⚠️ 仅支持PDF");
        });
        uploadZone.addEventListener("dragover", (e) => {
          e.preventDefault();
          uploadZone.classList.add("drag-over");
        });
        uploadZone.addEventListener("dragleave", () =>
          uploadZone.classList.remove("drag-over"),
        );
        uploadZone.addEventListener("drop", (e) => {
          e.preventDefault();
          uploadZone.classList.remove("drag-over");
          const f = e.dataTransfer.files[0];
          if (f?.type === "application/pdf" || f?.name.endsWith(".pdf"))
            loadPDF(f);
          else if (f) showToast("⚠️ 仅支持PDF");
        });
        btnRemoveFile.addEventListener("click", () => {
          resetUI();
          showToast("文件已移除");
        });
        btnNormalPrint.addEventListener("click", prepareNormalPrint);
        btnBookletPrint.addEventListener("click", () => {
          bookletSettings.style.display = "block";
          updateBookletInfo();
          prepareBookletPrint();
        });
        btnPosterPrint.addEventListener("click", () => {
          posterSettings.style.display = "block";
          preparePosterPrint();
        });
        btnDirectPrint.addEventListener("click", () => {
          if (!currentPDFFile) return showToast("⚠️ 请先上传PDF");
          showLoading("正在加载 PDF 预览...");
          // 使用 iframe 直接打印 PDF
          const fileURL = URL.createObjectURL(currentPDFFile);
          pdfFrame.src = fileURL;
          pdfFrame.onload = () => {
            // 延迟一点再打印，让加载提示先渲染
            setTimeout(() => {
              hideLoading();
              pdfFrame.contentWindow.print();
              URL.revokeObjectURL(fileURL);
            }, 300);
          };
          // 超时处理（10秒后自动隐藏加载）
          setTimeout(() => {
            if (loadingOverlay.classList.contains("active")) {
              hideLoading();
            }
          }, 10000);
        });
        posterPageInput.addEventListener("change", () => {
          let v = parseInt(posterPageInput.value);
          if (isNaN(v) || v < 1) v = 1;
          if (v > totalPages) v = totalPages;
          selectedPosterPage = v;
          posterPageInput.value = v;
        });
        bookletMarginSlider.addEventListener("input", () => {
          bookletMarginValue.textContent =
            parseFloat(bookletMarginSlider.value).toFixed(1) + " cm";
        });
      })();
    </script>
  </body>
</html>
